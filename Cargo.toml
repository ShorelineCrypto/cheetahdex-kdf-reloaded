[workspace]
members = [
    "mm2src/coins",
    "mm2src/common/shared_ref_counter",
    "mm2src/coins/lightning_persister",
    "mm2src/coins/lightning_background_processor",
    "mm2src/coins/utxo_signer",
    "mm2src/coins_activation",
    "mm2src/crypto",
    "mm2src/db_common",
    "mm2src/derives/enum_derives",
    "mm2src/derives/ser_error",
    "mm2src/derives/ser_error_derive",
    "mm2src/mm2_p2p",
    "mm2src/hw_common",
    "mm2src/mm2_bitcoin/crypto",
    "mm2src/mm2_bitcoin/chain",
    "mm2src/mm2_bitcoin/keys",
    "mm2src/mm2_bitcoin/rpc",
    "mm2src/mm2_bitcoin/primitives",
    "mm2src/mm2_bitcoin/script",
    "mm2src/mm2_bitcoin/serialization",
    "mm2src/mm2_bitcoin/serialization_derive",
    "mm2src/mm2_bitcoin/test_helpers",
    "mm2src/mm2_core",
    "mm2src/mm2_db",
    "mm2src/mm2_err_handle",
    "mm2src/mm2_eth",
    "mm2src/mm2_event_stream",
    "mm2src/mm2_metrics",
    "mm2src/mm2_test_helpers",

    "mm2src/mm2_main",
    "mm2src/mm2_net",
    "mm2src/mm2_net_config",
    "mm2src/mm2_number",
    "mm2src/mm2_state_machine",
    "mm2src/mm2_bin_lib",
    "mm2src/proxy_signature",
    "mm2src/mm2_git",
    "mm2src/mm2_gui_storage",
    "mm2src/mm2_io",
    "mm2src/mm2_rpc",
    "mm2src/rpc_task",
    "mm2src/trading_api",
    "mm2src/trezor",
]

# https://doc.rust-lang.org/beta/cargo/reference/features.html#feature-resolver-version-2
resolver = "2"

[workspace.dependencies]
# ── External crates (alphabetical) ──
async-trait = "0.1"
chrono = "0.4"
crossbeam-channel = "0.5.1"
derive_more = "0.99"
ethereum-types = { version = "0.13", default-features = false, features = ["std", "serialize"] }
fomat-macros = "0.2"
futures = { version = "0.3", package = "futures", features = ["compat", "async-await"] }
gstuff = "0.7"
hex = "0.4.2"
http = "0.2"
itertools = "0.10"
lazy_static = "1.4"
mocktopus = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_derive = { version = "1", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde_repr = "0.1.6"
tokio = { version = "1.47", default-features = false }
url = { version = "2.2.2", features = ["serde"] }

# ── Internal crates (alphabetical) ──
common = { path = "mm2src/common" }
mm2_core = { path = "mm2src/mm2_core" }
mm2_err_handle = { path = "mm2src/mm2_err_handle" }
mm2_main = { path = "mm2src/mm2_main" }
mm2_metrics = { path = "mm2src/mm2_metrics" }
mm2_number = { path = "mm2src/mm2_number" }

[profile.release]
# Due to the "package" section only affects out-of-workspace crates, as intended.
debug = true
debug-assertions = false

[profile.release.package."*"]
# Turns debugging symbols off for the out-of-workspace dependencies.
debug = false
