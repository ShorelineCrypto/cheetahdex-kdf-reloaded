[package]
# Local fork of `ethabi` 6.1.0 (originally Parity Technologies, MIT/Apache-2.0).
# Vendored from `https://github.com/artemii235/ethabi` (commit `d70bfd9`)
# to drop the artemii235 git dep — see LP-17 Phase 5c. The fork carries a
# small but ABI-wire-relevant fix to `encoder.rs::encode_token` for nested
# dynamic-array-of-bytes encoding (upstream PR #142). On-the-wire identical
# to the previous git fork; verified by the existing eth swap unit tests.
name = "ethabi"
version = "6.1.0"
authors = ["Parity Technologies <admin@parity.io>"]
license = "MIT/Apache-2.0"
description = "Vendored ethabi 6.1 with PR-142 nested dynamic-array fix."
edition = "2015"

[lib]
path = "src/lib.rs"

[dependencies]
rustc-hex = "2.0"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
tiny-keccak = "1.4"
error-chain = { version = "0.12", default-features = false }
ethereum-types = { version = "0.4", default-features = false, features = ["std", "serialize"] }

[dev-dependencies]
hex-literal = "0.1.1"

[features]
backtrace = ["error-chain/backtrace"]
