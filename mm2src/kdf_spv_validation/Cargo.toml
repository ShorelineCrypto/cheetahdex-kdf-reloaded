[package]
edition = "2021"
name = "kdf_spv_validation"
version = "0.1.0"
authors = ["Roman Sztergbaum <rmscastle@gmail.com>", "KDF-RELOADED contributors"]
license = "GPL-2.0-only"
publish = false

[dependencies]
chain = { package = "kdf_chain", path = "../kdf_chain" }
primitives = { package = "kdf_primitives", path = "../kdf_primitives" }
ripemd160 = "0.9.0"
rustc-hex = "2"
serialization = { package = "kdf_codec", path = "../kdf_codec" }
sha2 = "0.9"
test_helpers = { path = "../mm2_bitcoin/test_helpers" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"