[package]
name = "mm2_metamask"
version = "0.1.0"
edition = "2021"

[target.'cfg(target_arch = "wasm32")'.dependencies]
common = { path = "../common" }
derive_more = "0.99"
futures = "0.3"
itertools = "0.10"
js-sys = "0.3"
jsonrpc-core = "18"
lazy_static = "1.4"
mm2_err_handle = { path = "../mm2_err_handle" }
mm2_eth = { path = "../mm2_eth" }
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde_derive = "1.0"
# LP-17: replaces the GLEECBTC fork of rust-web3 (v0.20.0 + eip-1193).
# Used to convert serde-encoded params to JsValue and parse the JS-side
# RPC error shape returned by `window.ethereum.request`.
serde-wasm-bindgen = "0.4.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
