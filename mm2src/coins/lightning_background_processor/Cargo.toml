[package]
name = "lightning-background-processor"
version = "0.0.106"
authors = ["Valentine Wallace <vwallace@protonmail.com>"]
license = "MIT OR Apache-2.0"
repository = "http://github.com/lightningdevkit/rust-lightning"
description = """
Utilities to perform required background tasks for Rust Lightning.
"""
edition = "2021"

# The lightning `log_*!` macros check `cfg(feature = "max_level_*")` at compile-time.
# Declaring them avoids unexpected-cfg warnings without enabling any of them.
[features]
max_level_off = []
max_level_error = []
max_level_warn = []
max_level_info = []
max_level_debug = []
max_level_trace = []

[dependencies]
bitcoin = "0.27.1"
lightning = { git = "https://github.com/shamardy/rust-lightning", branch = "0.0.106", features = ["std"] }

[dev-dependencies]
db_common = { path = "../../db_common" }
lightning = { git = "https://github.com/shamardy/rust-lightning", branch = "0.0.106", features = ["_test_utils"] }
lightning-invoice = { git = "https://github.com/shamardy/rust-lightning", branch = "0.0.106" }
lightning-persister = { version = "0.0.106", path = "../lightning_persister" }
