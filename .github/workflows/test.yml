name: Tests

on:
  push:
    branches: [ reloaded-gplv2-base ]
  pull_request:
    branches: [ reloaded-gplv2-base ]

jobs:
  unit-tests:
    # Pin to the bare-metal Linux runner (`kdf-runner`, label `docker`).
    # Without a runner-specific label, the job could schedule onto the
    # Android NDK VM, which is slower and lacks the cargo cache.
    runs-on: [self-hosted, Linux, docker]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check Rust toolchain
        run: rustc --version && cargo --version

      - name: Run coins_activation tests
        run: cargo test -p coins_activation --lib

      - name: Run ordermatch tests
        run: cargo test -p mm2_main --lib ordermatch_tests

      - name: Run ETH utility tests
        run: cargo test -p coins --lib -- eth::eth_tests::test_addr_from_pubkey_str eth::eth_tests::test_gas_station_data eth::eth_tests::test_u256 eth::eth_tests::test_wei_from eth::eth_tests::test_wei_to

      - name: Run SPV validation tests
        run: cargo test -p kdf_spv_validation

      - name: Run mock RPC response tests
        run: cargo test -p coins --lib rpc_response_tests

      - name: Install nightly rustfmt
        # rustfmt.toml uses nightly-only options (`unstable_features = true`,
        # `fn_single_line`, `imports_indent = "Visual"`,
        # `inline_attribute_width`, `overflow_delimited_expr`). Stable rustfmt
        # silently ignores them and produces a different shape, so the format
        # check below must run on nightly even though the build/test toolchain
        # is stable.
        shell: bash
        run: rustup toolchain install nightly --profile minimal --component rustfmt --no-self-update

      - name: Check formatting
        # Run nightly rustfmt in check mode. Avoid piping through
        # `head`/`grep`: GitHub Actions runs bash with `-e -o pipefail`, so a
        # `head -N` that closes the pipe early sends SIGPIPE to cargo, the
        # pipeline reports non-zero, and `-e` kills the script BEFORE any
        # downstream `PIPESTATUS` override can run — masking the real diff.
        # Just let cargo print the full diff on failure; the runner log can
        # show it.
        shell: bash
        run: cargo +nightly fmt --all -- --check

  docker-tests:
    # Pin to the bare-metal Linux runner that has Docker (the `docker` label
    # is set on `kdf-runner`). Without it, the job could schedule onto any
    # Linux runner — e.g. the Android NDK VM — which has no Docker daemon.
    runs-on: [self-hosted, Linux, docker]
    timeout-minutes: 60
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Check Docker availability
        run: docker --version && docker info --format '{{.ServerVersion}}'

      - name: Free required host ports
        # The previous version only warned on busy ports and only cleaned
        # containers matching the two known images, so a stale container
        # (or any other process) bound to e.g. :8000 caused testcontainers
        # to abort with `failed to bind host port 0.0.0.0:8000/tcp`.
        # Aggressively remove every container publishing one of the test
        # ports, then SIGKILL any remaining host process bound to them.
        run: |
          set -eu
          for port in 7000 8000 9000 10000; do
            stale=$(docker ps -q --filter "publish=$port" || true)
            if [ -n "$stale" ]; then
              echo "Removing containers publishing :$port: $stale"
              docker rm -f $stale || true
            fi
            pids=$(ss -tlnpH "sport = :$port" 2>/dev/null \
              | grep -oP 'pid=\K[0-9]+' | sort -u || true)
            if [ -n "$pids" ]; then
              echo "Killing host pids on :$port: $pids"
              kill -9 $pids || true
            fi
          done

      - name: Clean up stale test containers
        run: |
          docker rm -f $(docker ps -aq --filter ancestor=artempikulin/testblockchain:multiarch) 2>/dev/null || true
          docker rm -f $(docker ps -aq --filter ancestor=sergeyboyko/qtumregtest) 2>/dev/null || true

      - name: Ensure Zcash params are present
        # The artempikulin/testblockchain image bind-mounts ~/.zcash-params
        # into komodod. If any of the five params files is missing, komodod
        # aborts with "Cannot find the Zcash network parameters" and never
        # binds its RPC port, which causes wait_ready to hit its 120 s
        # assert and the entire docker_tests job to fail with exit 101.
        # Lazily fetch only what is missing so a fresh runner self-heals.
        run: |
          set -eu
          dir="$HOME/.zcash-params"
          mkdir -p "$dir"
          declare -A urls=(
            [sapling-spend.params]=https://download.z.cash/downloads/sapling-spend.params
            [sapling-output.params]=https://download.z.cash/downloads/sapling-output.params
            [sprout-groth16.params]=https://download.z.cash/downloads/sprout-groth16.params
            [sprout-verifying.key]=https://download.z.cash/downloads/sprout-verifying.key
            [sprout-proving.key]=https://download.z.cash/downloads/sprout-proving.key.deprecated-sworn-elves
          )
          for f in "${!urls[@]}"; do
            if [ ! -s "$dir/$f" ]; then
              echo "Fetching $f"
              curl -fL --retry 3 -o "$dir/$f" "${urls[$f]}"
            fi
          done
          ls -lh "$dir"

      - name: Run UTXO docker tests
        run: cargo test --bin docker_tests -- --test-threads=1 test_search_for_swap_tx_spend test_one_hundred_maker_payments test_withdraw test_utxo_merge test_send_and_validate test_validate_maker_payment_wrong_amount test_list_unspent test_multiple_sequential
        env:
          RUST_LOG: debug
          BOB_PASSPHRASE: "also shoot benefit prefer juice shell elder veteran woman mimic image kidney"
          ALICE_PASSPHRASE: "spice describe gravity federal blast come thank unfair canal monkey style afraid"
