name: Build Android

# P7.5 — Android (aarch64, armv7) shared library builds.
#
# Produces `libmm2_bin_lib.so` for each ABI via cargo-ndk. Requires the
# Android NDK. Host runner is Linux (GitHub-hosted `ubuntu-latest` ships
# the NDK under `$ANDROID_NDK_ROOT`).
#
# Manually dispatched until verified against a downstream Android project.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
  workflow_call:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "release"
        type: string

jobs:
  build:
    # Pin to the dedicated Android NDK runner via its custom label.
    runs-on: [self-hosted, Linux, android-ndk]
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            ndk-abi: arm64-v8a
          - target: armv7-linux-androideabi
            ndk-abi: armeabi-v7a

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain for ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Verify Android NDK
        # The runner's systemd service launches with a minimal environment
        # and does not source the user's shell rc, so an NDK exported in
        # ~/.bashrc is invisible here. If ANDROID_NDK_ROOT is not already
        # set (via /etc/environment or ~/actions-runner/.env), probe the
        # standard install locations as a fallback.
        run: |
          if [ -z "$ANDROID_NDK_ROOT" ]; then
            for cand in \
              "$ANDROID_NDK_HOME" \
              "$HOME/Android/Sdk/ndk"/* \
              "/opt/android-ndk" \
              "/opt/android-sdk/ndk"/* \
              "/usr/local/lib/android/sdk/ndk"/*; do
              if [ -d "$cand" ] && [ -f "$cand/source.properties" ]; then
                echo "ANDROID_NDK_ROOT=$cand" >> $GITHUB_ENV
                ANDROID_NDK_ROOT="$cand"
                break
              fi
            done
          fi
          test -d "$ANDROID_NDK_ROOT" || {
            echo "ANDROID_NDK_ROOT not set or missing"; exit 1;
          }
          echo "NDK: $ANDROID_NDK_ROOT"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build mm2_bin_lib cdylib (${{ matrix.ndk-abi }})
        run: |
          cargo ndk --target ${{ matrix.target }} \
            --platform 24 \
            -- build -p mm2_bin_lib --profile ${{ inputs.profile }}

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: libmm2-${{ matrix.ndk-abi }}
          path: target/${{ matrix.target }}/${{ inputs.profile }}/libmm2_bin_lib.so
