name: Build WASM

# P7.1.a/e — WASM build safety net.
#
# Compiles the WASM-targeted parts of the workspace for
# `wasm32-unknown-unknown` so we get an automatic red signal whenever
# a change regresses the WASM build. Coverage:
#   - `cargo check -p coins`        (P7.1.a)
#   - `cargo check -p mm2_db`       (P7.1.a)
#   - `cargo check -p mm2_main`     (P7.1.e — gated by P7.1.b–d fixes)
#   - `wasm-pack build mm2src/mm2_main --target web` in the `build` job, which
#     produces the actual WASM artifact
#
# Build/test toolchain is stable per `rust-toolchain.toml`; rustfmt
# is unrelated to this workflow.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "dev"
      features:
        description: "comma-separated cargo features"
        required: false
        default: ""
  workflow_call:
    inputs:
      profile:
        description: "cargo profile"
        required: false
        default: "dev"
        type: string
      features:
        description: "comma-separated cargo features"
        required: false
        default: ""
        type: string

jobs:
  check:
    # Runs on a GitHub-hosted Ubuntu runner; the cargo/target cache below
    # keeps the wasm32 rebuild cost down across runs.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Add wasm32 target
        shell: bash
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm32-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check -p coins (wasm32)
        shell: bash
        run: cargo check --target wasm32-unknown-unknown -p coins

      - name: cargo check -p mm2_db (wasm32)
        shell: bash
        run: cargo check --target wasm32-unknown-unknown -p mm2_db

      - name: cargo check -p mm2_main (wasm32)
        shell: bash
        run: |
          FEATURES_FLAG=""
          if [ -n "${{ inputs.features }}" ]; then
            FEATURES_FLAG="--features ${{ inputs.features }}"
          fi
          cargo check --target wasm32-unknown-unknown -p mm2_main $FEATURES_FLAG

      - name: cargo check mm2_main (wasm32)
        shell: bash
        run: cargo check --target wasm32-unknown-unknown -p mm2_main

  # The real WASM artifact. `wasm-pack build` was present until 4a54d4415
  # (2026-08-05, "ci: replace wasm-pack with wasm build check"), which removed it
  # and left only the `cargo check` steps above - so the umbrella "all platforms"
  # builds that call this workflow have produced no WASM bundle since. The commit
  # recorded no reason, so whether the build still succeeds is unknown.
  #
  # It is therefore `continue-on-error` for now: a failure is visible as a red job
  # without breaking `staging-build.yml`, `dev-build*.yml` or `release.yml`, which
  # all call this workflow. Remove `continue-on-error` once the build is known
  # green - that is a deliberate follow-up, not an oversight.
  build:
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Add wasm32 target
        shell: bash
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        shell: bash
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          fi
          wasm-pack --version

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm32-${{ hashFiles('**/Cargo.lock') }}

      - name: wasm-pack build mm2_main
        shell: bash
        run: |
          PROFILE_FLAG="--dev"
          if [ "${{ inputs.profile }}" = "release" ]; then
            PROFILE_FLAG="--release"
          fi
          FEATURES_FLAG=""
          if [ -n "${{ inputs.features }}" ]; then
            FEATURES_FLAG="--features ${{ inputs.features }}"
          fi
          wasm-pack build mm2src/mm2_main \
            --target web \
            --out-dir ../../target/wasm-pack-out \
            $PROFILE_FLAG \
            -- $FEATURES_FLAG

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kdf-wasm32-unknown-unknown
          path: target/wasm-pack-out
          if-no-files-found: error
